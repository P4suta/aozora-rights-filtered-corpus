[package]
name = "aozora-rights-filtered-corpus"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"

[[bin]]
name = "xtask"
path = "src/xtask.rs"

[dependencies]
anyhow = "=1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.6", features = ["derive"] }
csv = "1.4"
encoding_rs = "=0.8.35"
rayon = "1.11"
regex = "=1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
toml = "1.1"
url = "=2.5.8"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
pretty_assertions = "=1.4.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
