name: ci

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
      - name: Add typos to PATH
        run: echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: cargo xtask check

  # The one status check branch protection requires,
  # named the same in every P4suta repository.
  # It passes only when every job it needs succeeded or was skipped.
  required:
    name: required
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'all(.[]; IN("success", "skipped"))' <<< "${RESULTS}"
